services:
  dc:
    build: ./tests/gpo
    hostname: dc
    networks:
      default:
        aliases: [dc.attend.test]
    volumes:
      - enroll-test:/run/enroll-test
      - ./tests/gpo/krb5.conf:/etc/krb5.conf:ro
      - ./deploy/gpo/debian:/opt/debian:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/run/enroll-test/ready"]
      interval: 2s
      timeout: 2s
      retries: 60
  app:
    environment:
      GATEWAY_ENROLL_REALM: ATTEND.TEST
      GATEWAY_ENROLL_KEY_FILE: /run/gateway-test/central-key
    volumes:
      - enroll-test:/run/gateway-test:ro
  central-https:
    image: caddy:2
    depends_on:
      dc: {condition: service_healthy}
      web: {condition: service_started}
    networks:
      default:
        aliases: [central.test]
    volumes:
      - enroll-test:/run/gateway-test:ro
      - ./tests/gpo/Caddyfile:/etc/caddy/Caddyfile:ro
  enroll:
    image: ${GPO_IMAGE:?Supply the test gateway image}
    build: ./deploy/gpo
    networks:
      default:
        aliases: [enroll.attend.test]
    depends_on:
      dc: {condition: service_healthy}
      app: {condition: service_started}
    volumes:
      - enroll-test:/run/secrets:ro
      - ./tests/gpo/krb5.conf:/etc/krb5.conf:ro
    environment:
      GPO_REALM: ATTEND.TEST
      GPO_LDAP_HOST: dc.attend.test
      GPO_BASE_DN: DC=attend,DC=test
      GPO_BIND_DN: CN=lookup,CN=Users,DC=attend,DC=test
      GPO_GROUP_DN: CN=Enrollable,CN=Users,DC=attend,DC=test
volumes:
  enroll-test:
