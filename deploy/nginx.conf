map $uri $dochazka_csp {
    default "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'";
    ~^/docs(?:/|$) "frame-ancestors 'none'; base-uri 'self'; object-src 'none'";
    # OpenCV uses dynamic bindings in a dedicated worker. Its policy forbids fetch and WebSockets.
    ~^/assets/document-scan\.worker-[A-Za-z0-9_-]+\.js$ "default-src 'none'; script-src 'self' 'unsafe-eval'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
}

server {
    listen 80;
    server_name _;
    root /srv/dochazka/public;
    index index.html;
    client_max_body_size 7340032;
    gzip on;
    gzip_types application/javascript application/json text/css;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy $dochazka_csp always;

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/dochazka/public/index.php;
        fastcgi_param HTTP_PROXY "";
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_backend app:9000;
        fastcgi_pass $php_backend;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
