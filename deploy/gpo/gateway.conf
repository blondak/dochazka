ServerName enrollment
ErrorLog /proc/self/fd/2
ServerTokens Prod
ServerSignature Off
LDAPVerifyServerCert On
LDAPTrustedGlobalCert CA_BASE64 /run/secrets/gpo_ldap_ca
LDAPCacheEntries 0
LDAPOpCacheEntries 0

<VirtualHost *:80>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    <Location "/">
        Require all denied
    </Location>
    <LocationMatch "^/api/v1/domain-enroll$">
        AuthType GSSAPI
        AuthName "Dochazka GPO"
        AuthzSendForbiddenOnFailure On
        GssapiCredStore keytab:/run/secrets/gpo_keytab
        GssapiAllowedMech krb5
        GssapiLocalName On
        GssapiBasicAuth Off
        AuthLDAPURL "ldaps://${GPO_LDAP_HOST}/${GPO_BASE_DN}?sAMAccountName?sub?(&(objectClass=computer)(!(userAccountControl:1.2.840.113556.1.4.803:=2)))"
        AuthLDAPBindDN "${GPO_BIND_DN}"
        AuthLDAPBindPassword "exec:/bin/cat /run/secrets/gpo_bind_password"
        AuthLDAPGroupAttribute member
        AuthLDAPGroupAttributeIsDN On
        AuthLDAPMaxSubGroupDepth 0
        <RequireAll>
            Require method POST
            Require valid-user
            Require expr "%{reqenv:GSS_NAME} == '%{REMOTE_USER}@${GPO_REALM}'"
            Require ldap-group ${GPO_GROUP_DN}
        </RequireAll>
        ProxyFCGISetEnvIf "true" DOCHAZKA_MACHINE_PRINCIPAL "%{reqenv:GSS_NAME}"
        ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "/srv/dochazka/public/index.php"
        ProxyFCGISetEnvIf "true" SCRIPT_NAME "/index.php"
    </LocationMatch>
    ProxyPassMatch "^/api/v1/domain-enroll$" "fcgi://app:9000/srv/dochazka/public/index.php"
</VirtualHost>
